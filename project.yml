# Xcode project spec. Generate the .xcodeproj on a Mac with:  xcodegen generate
name: MapleWallet
options:
  bundleIdPrefix: com.jamierowe
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Config/Auth.xcconfig
  Release: Config/Auth.xcconfig
packages:
  Core: { path: Packages/Core }
  DesignSystem: { path: Packages/DesignSystem }
  Networking: { path: Packages/Networking }
  Auth: { path: Packages/Auth }
  Accounts: { path: Packages/Accounts }
  Transfers: { path: Packages/Transfers }
targets:
  MapleWallet:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: Config/MapleWallet-Info.plist
      properties:
        CFBundleDisplayName: Maple Wallet
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.jamierowe.maplewallet
            CFBundleURLSchemes: [maplewallet]
        AUTH0_DOMAIN: $(AUTH0_DOMAIN)
        AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
        NSFaceIDUsageDescription: Use Face ID to unlock Maple Wallet instead of signing in each time.
        NSCameraUsageDescription: Take a photo of a cheque to deposit it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamierowe.maplewallet
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: Core
      - package: DesignSystem
      - package: Networking
      - package: Auth
      - package: Accounts
