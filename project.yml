# Xcode project spec. Generate the .xcodeproj on a Mac with:  xcodegen generate
name: MapleWallet
options:
  bundleIdPrefix: com.jamierowe
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Config/Auth.xcconfig
  Release: Config/Auth.xcconfig
packages:
  Core: { path: Packages/Core }
  DesignSystem: { path: Packages/DesignSystem }
  Networking: { path: Packages/Networking }
  Auth: { path: Packages/Auth }
  Accounts: { path: Packages/Accounts }
  Transfers: { path: Packages/Transfers }
targets:
  MapleWallet:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: Config/MapleWallet-Info.plist
      properties:
        CFBundleDisplayName: Maple Wallet
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.jamierowe.maplewallet
            CFBundleURLSchemes: [maplewallet]
        AUTH0_DOMAIN: $(AUTH0_DOMAIN)
        AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
        NSFaceIDUsageDescription: Use Face ID to unlock Maple Wallet instead of signing in each time.
        NSCameraUsageDescription: Take a photo of a cheque to deposit it.
    entitlements:
      path: Config/MapleWallet.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jamierowe.maplewallet]
        # Universal Links need a paid account and a domain you control. Uncomment when you have both:
        # com.apple.developer.associated-domains: [applinks:maplewallet.example]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamierowe.maplewallet
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: Core
      - package: DesignSystem
      - package: Networking
      - package: Auth
      - package: Accounts
      - package: Transfers
      - target: MapleWalletWidget

  MapleWalletWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    info:
      path: Config/MapleWalletWidget-Info.plist
      properties:
        CFBundleDisplayName: Maple Wallet
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/MapleWalletWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jamierowe.maplewallet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamierowe.maplewallet.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        # WidgetKit's callback-based provider API predates Swift 6 checking; the app itself stays in Swift 6.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - package: Core

  MapleWalletUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamierowe.maplewallet.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # UI tests drive the app from outside; Swift 5 mode keeps XCUITest's older APIs simple.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - target: MapleWallet

schemes:
  MapleWallet:
    build:
      targets:
        MapleWallet: all
        MapleWalletUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets: [MapleWallet]
      targets: [MapleWalletUITests]

  MapleWalletUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamierowe.maplewallet.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
